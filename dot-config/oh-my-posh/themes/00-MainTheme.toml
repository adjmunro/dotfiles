"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
final_space = true
version = 3
console_title_template = "{{ .Shell }} in {{ .Folder }}"

[palette]
transparent = "#00000000"
white = "#ffffffff"

[[blocks]]
type = "prompt"
alignment = "left"

  [[blocks.segments]]
  type = "path"
  style = "powerline"
  powerline_symbol = ""
  foreground = "#p:white"
  background = "#61AFEF"

    [blocks.segments.properties]
    style = "full"

  [[blocks.segments]]
  type = "text"
  style = "plain"
  template = ">"
